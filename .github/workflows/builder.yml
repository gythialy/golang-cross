name: Build golang-cross-builder

# Deliberately no `concurrency:` here. This is a reusable workflow invoked by
# both auto-release-go.yml (PR-stage, push_images: false) and
# release-golang-cross.yml (publishing). `github.workflow` inside a called
# workflow resolves to the CALLER's name, so a group here would either
# duplicate the caller's own concurrency group or serialize two unrelated
# callers behind each other. Each caller sets its own group instead.
on:  # zizmor: ignore[concurrency-limits]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build from (branch/tag/sha). Defaults to the default branch.
        type: string
        required: false
      publish_latest:
        description: Also tag the newest major's build as `latest` (default true).
        type: boolean
        required: false
      version:
        description: Only build these Go major.minor versions (comma-separated, e.g. 1.26 or 1.25,1.26). Empty builds all supported versions.
        type: string
        required: false
      latest_major:
        description: Major.minor that owns the latest tag (defaults to the highest supported). Ignored when publish_latest is false.
        type: string
        required: false
      push_images:
        description: Push built images to the registry (default true; false = build locally for smoke-test only).
        type: boolean
        required: false
      revision:
        description: Image build revision N used in the vX.Y.Z-N image tags (default 0). release-golang-cross.yml passes the N from the release tag.
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        description: Git ref to build from (branch/tag/sha). Defaults to the triggering ref.
        type: string
        required: false
      publish_latest:
        description: Also tag the newest major's trixie build as `latest` (default true).
        type: boolean
        required: false
      version:
        description: Only build these Go major.minor versions (comma-separated, e.g. 1.26 or 1.25,1.26). Empty builds all supported versions.
        type: string
        required: false
      latest_major:
        description: Major.minor that owns the latest tag (defaults to the highest supported). Ignored when publish_latest is false.
        type: string
        required: false
      push_images:
        description: Push built images to the registry (default true; false = build locally for smoke-test only).
        type: boolean
        required: false
      revision:
        description: Image build revision N used in the vX.Y.Z-N image tags (default 0). release-golang-cross.yml passes the N from the release tag.
        type: string
        required: false

permissions: {}

jobs:
  load-versions:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      matrix_tools: ${{ steps.set-matrix.outputs.matrix_tools }}
      latest_major: ${{ steps.latest.outputs.major }}
      revision: ${{ steps.scope.outputs.revision }}
    steps:
      # Publishing is owned by the vX.Y.Z-N release tag. release-golang-cross.yml
      # refuses to run from a branch for that reason, but this workflow is
      # independently dispatchable AND publishes and signs, so without the same
      # rule here the invariant is only half enforced: a dispatch from main
      # would publish images signed @refs/heads/main, which is exactly the
      # identity that made 1.25.14 / 1.26.7 / 1.27.0 unpinnable.
      #
      # The condition mirrors the `push:` expression on the build step below,
      # so the guard and the actual push can never disagree. push_images: false
      # is the PR-stage build and stays allowed from a branch: it publishes
      # none of the images consumers pin.
      - name: Refuse to publish from a non-tag ref
        if: inputs.push_images != false && github.ref_type != 'tag'
        run: |
          echo "Refusing to publish from ${GITHUB_REF} (${GITHUB_REF_TYPE})." >&2
          echo "Images would be signed @${GITHUB_REF} instead of" >&2
          echo "@refs/tags/vX.Y.Z-N. Dispatch against the release tag:" >&2
          echo "  gh workflow run builder.yml --ref vX.Y.Z-N" >&2
          exit 1

      # All three jobs check out `inputs.ref || github.ref`, so a dispatch like
      # `--ref v1.27.1-1 -f ref=main` would build main's tree while tagging and
      # signing it as v1.27.1-1 -- the same content-vs-identity split that
      # `ref: main` caused in release-golang-cross.yml before #473, reachable
      # here through the `ref` input instead. On a publishing run the triggering
      # tag is the only permitted source.
      - name: Refuse a ref input that disagrees with the tag
        if: inputs.push_images != false && inputs.ref != ''
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          case "$INPUT_REF" in
            "$GITHUB_REF"|"$GITHUB_REF_NAME"|"refs/tags/${GITHUB_REF_NAME}") ;;
            *)
              echo "Refusing to publish: ref input '${INPUT_REF}' is not the" >&2
              echo "triggering tag ${GITHUB_REF_NAME}. The images would be built" >&2
              echo "from '${INPUT_REF}' but signed @${GITHUB_REF}. Omit the input" >&2
              echo "and dispatch against the tag you want to publish." >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      # On a publishing run the ref is the authority for BOTH the build revision
      # and which version it applies to. `inputs.revision` has no default, so a
      # dispatch that follows the message above -- `gh workflow run builder.yml
      # --ref v1.27.1-1` -- would otherwise resolve to revision 0 and republish
      # EVERY major's -0 tags, the codename-less aliases and `latest`, all
      # signed @refs/tags/v1.27.1-1: the orphaned-digest / unpinnable-identity
      # class this scheme exists to close, reachable from our own error message.
      # Deriving from the ref makes that message correct rather than a trap.
      #
      # Not applied when push_images is false: the pre-merge build publishes
      # none of the images consumers pin and legitimately runs from a branch.
      - name: Resolve build revision and version scope
        id: scope
        env:
          INPUT_REVISION: ${{ inputs.revision }}
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISHING: ${{ inputs.push_images != false }}
        run: |
          REVISION="$INPUT_REVISION"
          # The matrix jq splits on bare commas, so a stray space would leave a
          # valid major silently unmatched.
          VERSION="${INPUT_VERSION// /}"

          if [ "$PUBLISHING" = "true" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-(0|[1-9][0-9]*)$'; then
              echo "Refusing to publish from ${GITHUB_REF_NAME}: not a build-revision" >&2
              echo "tag (expected vX.Y.Z-N). The images would carry a cosign identity" >&2
              echo "naming a ref that no published version corresponds to." >&2
              exit 1
            fi
            TAG_VERSION="${TAG%-*}"                      # X.Y.Z
            TAG_REVISION="${TAG##*-}"                    # N
            TAG_MAJOR="${TAG_VERSION%.*}"                # X.Y

            if [ -n "$REVISION" ] && [ "$REVISION" != "$TAG_REVISION" ]; then
              echo "The revision input (${REVISION}) disagrees with the ref" >&2
              echo "${GITHUB_REF_NAME}, which carries revision ${TAG_REVISION}." >&2
              echo "The ref is what signs the images, so it wins -- omit the input." >&2
              exit 1
            fi
            REVISION="$TAG_REVISION"

            # A non-zero revision is a property of one version's images, so it
            # must not be stamped onto the other majors of an unfiltered run.
            if [ "$TAG_REVISION" != "0" ]; then
              if [ -z "$VERSION" ]; then
                VERSION="$TAG_MAJOR"
              elif [ "$VERSION" != "$TAG_MAJOR" ]; then
                echo "Ref ${GITHUB_REF_NAME} carries build revision ${TAG_REVISION}," >&2
                echo "which applies only to ${TAG_MAJOR}, but version=${VERSION}." >&2
                echo "Release one version per revision tag." >&2
                exit 1
              fi
            fi
            # Pinning by tag only works if the tag's version is the one that
            # gets built. release-golang-cross.yml checks this, but the
            # standalone publishing path did not: a hand-cut v1.27.1-1 pointing
            # at a commit whose manifest still says go1.27.0 would publish
            # v1.27.0-1-* matrix tags under the v1.27.1-1 identity.
            MANIFEST_VERSION=$(jq -r --arg m "$TAG_MAJOR" '.releases[$m].version // empty' versions.json)
            if [ -z "$MANIFEST_VERSION" ]; then
              echo "Ref ${GITHUB_REF_NAME} names ${TAG_MAJOR}, which has no entry in" >&2
              echo "versions.json at this commit. Nothing would be built for the" >&2
              echo "version the images would be signed as." >&2
              exit 1
            fi
            if [ "${MANIFEST_VERSION#go}" != "$TAG_VERSION" ]; then
              echo "Ref ${GITHUB_REF_NAME} names Go ${TAG_VERSION}, but versions.json" >&2
              echo "at this commit has ${MANIFEST_VERSION} for ${TAG_MAJOR}. Publishing" >&2
              echo "would tag images v${MANIFEST_VERSION#go}-${REVISION}-* while signing" >&2
              echo "them @${GITHUB_REF}." >&2
              exit 1
            fi

            echo "Publishing ${VERSION:-all supported majors} at revision ${REVISION} from ${GITHUB_REF_NAME}"
          fi

          REVISION="${REVISION:-0}"
          # Exact, deliberately not `grep -E '^[0-9]+$'`: grep matches per LINE,
          # so a multi-line value passes and injects a second entry into the
          # metadata-action tag list.
          case "$REVISION" in
            ''|*[!0-9]*|0?*)
              echo "revision must be a canonical non-negative integer (no leading" >&2
              echo "zeros), got: '${REVISION}'" >&2
              exit 1
              ;;
          esac

          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build matrix from versions.json
        id: set-matrix
        env:
          VERSION: ${{ steps.scope.outputs.version }}
        run: |
          # Each version x codename x builder; the comma-separated version
          # input scopes the build, matrix_tools dedupes to version x codename
          # for the shared tools image.
          if [ -n "$VERSION" ]; then
            MATRIX=$(jq -c --arg v "$VERSION" '[.releases | to_entries[] | .key as $m | select(($v | split(",")) | index($m)) | .value as $v2 | $v2.codenames[] as $c | $v2.builders[] as $b | {gover: $m, go_version: $v2.version, codename: $c, builder: $b}]' versions.json)
          else
            MATRIX=$(jq -c '[.releases | to_entries[] | .key as $m | .value as $v | $v.codenames[] as $c | $v.builders[] as $b | {gover: $m, go_version: $v.version, codename: $c, builder: $b}]' versions.json)
          fi
          MATRIX_TOOLS=$(echo "$MATRIX" | jq -c '[.[] | {gover, go_version, codename}] | unique')
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "matrix_tools=${MATRIX_TOOLS}" >> "$GITHUB_OUTPUT"
          echo "Matrix: ${MATRIX}"

      - name: Resolve latest major
        id: latest
        env:
          LATEST_MAJOR: ${{ inputs.latest_major }}
        run: |
          if [ -n "$LATEST_MAJOR" ]; then
            echo "major=$LATEST_MAJOR" >> "$GITHUB_OUTPUT"
          else
            echo "major=$(jq -r '.supported[-1]' versions.json)" >> "$GITHUB_OUTPUT"
          fi

  # Build the shared golang-cross-tools base image (golang + release tools).
  # It is the FROM base of both the osxcross builder and the zig image, so it
  # is always pushed — even in PR smoke-test mode — because the build job
  # below pulls it from the registry: buildx container driver cannot see an
  # image that was only --load'ed into the local daemon of another job.
  build-tools:
    needs: load-versions
    strategy:
      matrix:
        include: ${{ fromJson(needs.load-versions.outputs.matrix_tools) }}

    runs-on: ubuntu-latest
    continue-on-error: false

    permissions:
      id-token: write  # write: keyless cosign signing of the tools base image
      packages: write  # write: pushes ghcr.io/<owner>/golang-cross-tools
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Get Repo Owner
        id: get_repo_owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "repo_owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve tools tag
        id: tools
        env:
          GO_VERSION: ${{ matrix.go_version }}
        run: |
          # strip leading "go" from version for the tools image tag
          GO_BARE="${GO_VERSION#go}"
          echo "go_bare=${GO_BARE}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.get_repo_owner.outputs.repo_owner }}/golang-cross-tools
          tags: |
            type=raw,value=v${{ steps.tools.outputs.go_bare }}-${{ needs.load-versions.outputs.revision }}-${{ matrix.codename }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ steps.get_repo_owner.outputs.repo_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tools image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: buildpush
        with:
          context: .
          file: Dockerfile.tools
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            GO_VERSION=${{ steps.tools.outputs.go_bare }}
            OS_CODENAME=${{ matrix.codename }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the images
        # Always pushed above, so a missing digest means an action regression.
        run: |
          if [ -z "$DIGEST" ]; then
            echo "push=true but the build-push step produced no digest; refusing to sign an empty reference" >&2
            exit 1
          fi
          echo "signing ghcr.io/${REPO_OWNER}/golang-cross-tools@${DIGEST}"
          cosign sign --yes "ghcr.io/${REPO_OWNER}/golang-cross-tools@${DIGEST}"
        shell: bash
        env:
          DIGEST: ${{ steps.buildpush.outputs.digest }}
          REPO_OWNER: ${{ steps.get_repo_owner.outputs.repo_owner }}

  build:
    needs: [load-versions, build-tools]
    strategy:
      matrix:
        include: ${{ fromJson(needs.load-versions.outputs.matrix) }}

    runs-on: ubuntu-latest
    continue-on-error: false

    permissions:
      id-token: write  # write: keyless cosign signing of the builder/zig images
      packages: write  # write: pushes golang-cross / golang-cross-builder (skipped when push_images is false, but the grant has to cover the pushing case)
      contents: read

    env:
      DOCKER_REGISTRY: "ghcr.io"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Get Repo Owner
        id: get_repo_owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "repo_owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Select Dockerfile by builder
        id: dockerfile
        env:
          BUILDER: ${{ matrix.builder }}
          GO_VERSION: ${{ matrix.go_version }}
        run: |
          # strip leading "go" from version for golang official image tags
          GO_BARE="${GO_VERSION#go}"
          echo "go_bare=${GO_BARE}" >> "$GITHUB_OUTPUT"
          if [ "$BUILDER" = "zig" ]; then
            echo "file=Dockerfile.zig" >> "$GITHUB_OUTPUT"
            # zig builds publish to the main golang-cross repo, tag suffixed with -zig
            echo "image=golang-cross" >> "$GITHUB_OUTPUT"
            echo "tag_suffix=-zig" >> "$GITHUB_OUTPUT"
          else
            echo "file=Dockerfile.builder" >> "$GITHUB_OUTPUT"
            echo "image=golang-cross-builder" >> "$GITHUB_OUTPUT"
            echo "tag_suffix=" >> "$GITHUB_OUTPUT"
          fi

      # The codename-less tag mirrors the git release tag verbatim (git
      # v1.27.1-1 -> image v1.27.1-1), so an image can be pinned with the same
      # string that published and signed it. Only the trixie zig build publishes
      # it — the variant `latest` also points at — because a major can ship two
      # codenames and two toolchains (1.24 = osxcross + zig), and the alias has
      # to resolve to exactly one of them.
      #
      # The VERSION half comes from the matrix, not from GITHUB_REF_NAME: a
      # dispatch can release several majors from a single tag ref, which names
      # only one of them. The REVISION half comes from the caller, defaulting to
      # 0 so the pre-merge build and a plain dispatch are unaffected;
      # release-golang-cross.yml passes the N it parsed out of the release tag,
      # which is what makes a hand-cut vX.Y.Z-1 publish vX.Y.Z-1 images.
      #
      # `latest` and the `{major}` aliases follow the most recently PUBLISHED
      # revision, not the numerically highest: re-running an older revision
      # moves them back. Cut the next free N instead of rebuilding an old one.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.get_repo_owner.outputs.repo_owner }}/${{ steps.dockerfile.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ inputs.publish_latest != false && matrix.gover == needs.load-versions.outputs.latest_major && matrix.codename == 'trixie' }}
            type=raw,value=v${{ steps.dockerfile.outputs.go_bare }}-${{ needs.load-versions.outputs.revision }}-${{ matrix.codename }}${{ steps.dockerfile.outputs.tag_suffix }}
            type=raw,value=${{ matrix.gover }}${{ steps.dockerfile.outputs.tag_suffix }}
            type=raw,value=v${{ steps.dockerfile.outputs.go_bare }}-${{ needs.load-versions.outputs.revision }},enable=${{ matrix.builder == 'zig' && matrix.codename == 'trixie' }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ steps.get_repo_owner.outputs.repo_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: buildpush
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          # Push depends ONLY on this boolean input (default true).
          # github.event_name inside a reusable workflow is the CALLER's
          # trigger — conditioning on it silently disabled pushing when the
          # release ran on push events (empty-digest cosign failure).
          load: ${{ inputs.push_images == false }}
          push: ${{ inputs.push_images != false }}
          # zig ships multi-arch; osxcross stays amd64-only. Local builds
          # (push_images=false) load a single amd64 image for docker run.
          platforms: ${{ matrix.builder == 'zig' && inputs.push_images != false && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          build-args: |
            GO_VERSION=${{ steps.dockerfile.outputs.go_bare }}
            REVISION=${{ needs.load-versions.outputs.revision }}
            OSX_VERSION_MIN=10.13
            OSX_CROSS_COMMIT=ff8d100f3f026b4ffbe4ce96d8aac4ce06f1278b
            OS_CODENAME=${{ matrix.codename }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # osxcross's ~30min stage-1 compile is cached in the registry (no
          # 7-day TTL, doesn't count against the 10 GB Actions cache quota);
          # zig layers change with every Go patch so gha cache is enough.
          cache-from: |
            ${{ matrix.builder == 'osxcross' && format('type=registry,ref=ghcr.io/{0}/golang-cross:buildcache-osxcross-{1}', steps.get_repo_owner.outputs.repo_owner, matrix.codename) || 'type=gha' }}
          cache-to: |
            ${{ matrix.builder == 'osxcross' && format('type=registry,ref=ghcr.io/{0}/golang-cross:buildcache-osxcross-{1},mode=max', steps.get_repo_owner.outputs.repo_owner, matrix.codename) || 'type=gha,mode=max' }}

      - name: Sign the images
        # Nothing is published when building locally for the PR smoke-test.
        if: inputs.push_images != false
        run: |
          if [ -z "$DIGEST" ]; then
            echo "push=true but the build-push step produced no digest; refusing to sign an empty reference" >&2
            exit 1
          fi
          echo "signing ghcr.io/${REPO_OWNER}/${IMAGE_NAME}@${DIGEST}"
          cosign sign --yes "ghcr.io/${REPO_OWNER}/${IMAGE_NAME}@${DIGEST}"
        shell: bash
        env:
          DIGEST: ${{ steps.buildpush.outputs.digest }}
          REPO_OWNER: ${{ steps.get_repo_owner.outputs.repo_owner }}
          IMAGE_NAME: ${{ steps.dockerfile.outputs.image }}

      # PR-stage zig smoke test runs HERE: the image was --load'ed into this
      # job's daemon and nothing was pushed, so no other job can pull it.
      - name: Smoke-test zig image (PR verification)
        if: matrix.builder == 'zig' && inputs.push_images == false && matrix.codename == 'trixie'
        env:
          REPO_OWNER: ${{ steps.get_repo_owner.outputs.repo_owner }}
          GO_BARE: ${{ steps.dockerfile.outputs.go_bare }}
          REVISION: ${{ needs.load-versions.outputs.revision }}
        run: |
          IMAGE="ghcr.io/${REPO_OWNER}/golang-cross:v${GO_BARE}-${REVISION}-trixie-zig"
          echo "smoke-testing ${IMAGE}"
          cd example/sqlite-example && make smoke-test IMAGE="${IMAGE}" CONFIG=.goreleaser.zig.yml
          cd ../openssl-example && make smoke-test IMAGE="${IMAGE}"
