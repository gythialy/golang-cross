name: Build golang-cross-builder

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build from (branch/tag/sha). Defaults to the default branch.
        type: string
        required: false
      publish_latest:
        description: Also tag the newest major's build as `latest` (default true).
        type: boolean
        required: false
      version:
        description: Only build these Go major.minor versions (comma-separated, e.g. 1.26 or 1.25,1.26). Empty builds all supported versions.
        type: string
        required: false
      latest_major:
        description: Major.minor that owns the latest tag (defaults to the highest supported). Ignored when publish_latest is false.
        type: string
        required: false
      push_images:
        description: Push built images to the registry (default true; false = build locally for smoke-test only).
        type: boolean
        required: false
  workflow_call:
    inputs:
      ref:
        description: Git ref to build from (branch/tag/sha). Defaults to the triggering ref.
        type: string
        required: false
      publish_latest:
        description: Also tag the newest major's trixie build as `latest` (default true).
        type: boolean
        required: false
      version:
        description: Only build these Go major.minor versions (comma-separated, e.g. 1.26 or 1.25,1.26). Empty builds all supported versions.
        type: string
        required: false
      latest_major:
        description: Major.minor that owns the latest tag (defaults to the highest supported). Ignored when publish_latest is false.
        type: string
        required: false
      push_images:
        description: Push built images to the registry (default true; false = build locally for smoke-test only).
        type: boolean
        required: false

permissions: {}

jobs:
  load-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      matrix_tools: ${{ steps.set-matrix.outputs.matrix_tools }}
      latest_major: ${{ steps.latest.outputs.major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build matrix from versions.json
        id: set-matrix
        run: |
          # Each version x codename x builder; the comma-separated version
          # input scopes the build, matrix_tools dedupes to version x codename
          # for the shared tools image.
          if [ -n "${{ inputs.version }}" ]; then
            MATRIX=$(jq -c --arg v "${{ inputs.version }}" '[.releases | to_entries[] | .key as $m | select(($v | split(",")) | index($m)) | .value as $v2 | $v2.codenames[] as $c | $v2.builders[] as $b | {gover: $m, go_version: $v2.version, codename: $c, builder: $b}]' versions.json)
          else
            MATRIX=$(jq -c '[.releases | to_entries[] | .key as $m | .value as $v | $v.codenames[] as $c | $v.builders[] as $b | {gover: $m, go_version: $v.version, codename: $c, builder: $b}]' versions.json)
          fi
          MATRIX_TOOLS=$(echo "$MATRIX" | jq -c '[.[] | {gover, go_version, codename}] | unique')
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "matrix_tools=${MATRIX_TOOLS}" >> "$GITHUB_OUTPUT"
          echo "Matrix: ${MATRIX}"

      - name: Resolve latest major
        id: latest
        run: |
          if [ -n "${{ inputs.latest_major }}" ]; then
            echo "major=${{ inputs.latest_major }}" >> "$GITHUB_OUTPUT"
          else
            echo "major=$(jq -r '.supported[-1]' versions.json)" >> "$GITHUB_OUTPUT"
          fi

  # Build the shared golang-cross-tools base image (golang + release tools).
  # It is the FROM base of both the osxcross builder and the zig image, so it
  # is always pushed — even in PR smoke-test mode — because the build job
  # below pulls it from the registry: buildx container driver cannot see an
  # image that was only --load'ed into the local daemon of another job.
  build-tools:
    needs: load-versions
    strategy:
      matrix:
        include: ${{ fromJson(needs.load-versions.outputs.matrix_tools) }}

    runs-on: ubuntu-latest
    continue-on-error: false

    permissions:
      id-token: write
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Get Repo Owner
        id: get_repo_owner
        run: echo "repo_owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve tools tag
        id: tools
        run: |
          # strip leading "go" from version for the tools image tag
          GO_BARE="${{ matrix.go_version }}"
          GO_BARE="${GO_BARE#go}"
          echo "go_bare=${GO_BARE}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.get_repo_owner.outputs.repo_owner }}/golang-cross-tools
          tags: |
            type=raw,value=v${{ steps.tools.outputs.go_bare }}-0-${{ matrix.codename }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ steps.get_repo_owner.outputs.repo_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tools image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: buildpush
        with:
          context: .
          file: Dockerfile.tools
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            GO_VERSION=${{ steps.tools.outputs.go_bare }}
            OS_CODENAME=${{ matrix.codename }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the images
        # Always pushed above, so a missing digest means an action regression.
        run: |
          if [ -z "$DIGEST" ]; then
            echo "push=true but the build-push step produced no digest; refusing to sign an empty reference" >&2
            exit 1
          fi
          echo "signing ghcr.io/${REPO_OWNER}/golang-cross-tools@${DIGEST}"
          cosign sign --yes "ghcr.io/${REPO_OWNER}/golang-cross-tools@${DIGEST}"
        shell: bash
        env:
          DIGEST: ${{ steps.buildpush.outputs.digest }}
          REPO_OWNER: ${{ steps.get_repo_owner.outputs.repo_owner }}

  build:
    needs: [load-versions, build-tools]
    strategy:
      matrix:
        include: ${{ fromJson(needs.load-versions.outputs.matrix) }}

    runs-on: ubuntu-latest
    continue-on-error: false

    permissions:
      id-token: write
      packages: write
      contents: read

    env:
      DOCKER_REGISTRY: "ghcr.io"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Get Repo Owner
        id: get_repo_owner
        run: echo "repo_owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Select Dockerfile by builder
        id: dockerfile
        env:
          BUILDER: ${{ matrix.builder }}
        run: |
          # strip leading "go" from version for golang official image tags
          GO_BARE="${{ matrix.go_version }}"
          GO_BARE="${GO_BARE#go}"
          echo "go_bare=${GO_BARE}" >> "$GITHUB_OUTPUT"
          if [ "$BUILDER" = "zig" ]; then
            echo "file=Dockerfile.zig" >> "$GITHUB_OUTPUT"
            # zig builds publish to the main golang-cross repo, tag suffixed with -zig
            echo "image=golang-cross" >> "$GITHUB_OUTPUT"
            echo "tag_suffix=-zig" >> "$GITHUB_OUTPUT"
          else
            echo "file=Dockerfile.builder" >> "$GITHUB_OUTPUT"
            echo "image=golang-cross-builder" >> "$GITHUB_OUTPUT"
            echo "tag_suffix=" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.get_repo_owner.outputs.repo_owner }}/${{ steps.dockerfile.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ inputs.publish_latest != false && matrix.gover == needs.load-versions.outputs.latest_major && matrix.codename == 'trixie' }}
            type=raw,value=v${{ steps.dockerfile.outputs.go_bare }}-0-${{ matrix.codename }}${{ steps.dockerfile.outputs.tag_suffix }}
            type=raw,value=${{ matrix.gover }}${{ steps.dockerfile.outputs.tag_suffix }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ steps.get_repo_owner.outputs.repo_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: buildpush
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          # Push depends ONLY on this boolean input (default true).
          # github.event_name inside a reusable workflow is the CALLER's
          # trigger — conditioning on it silently disabled pushing when the
          # release ran on push events (empty-digest cosign failure).
          load: ${{ inputs.push_images == false }}
          push: ${{ inputs.push_images != false }}
          # zig ships multi-arch; osxcross stays amd64-only. Local builds
          # (push_images=false) load a single amd64 image for docker run.
          platforms: ${{ matrix.builder == 'zig' && inputs.push_images != false && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          build-args: |
            GO_VERSION=${{ steps.dockerfile.outputs.go_bare }}
            OSX_VERSION_MIN=10.13
            OSX_CROSS_COMMIT=ff8d100f3f026b4ffbe4ce96d8aac4ce06f1278b
            OS_CODENAME=${{ matrix.codename }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # osxcross's ~30min stage-1 compile is cached in the registry (no
          # 7-day TTL, doesn't count against the 10 GB Actions cache quota);
          # zig layers change with every Go patch so gha cache is enough.
          cache-from: |
            ${{ matrix.builder == 'osxcross' && format('type=registry,ref=ghcr.io/{0}/golang-cross:buildcache-osxcross-{1}', steps.get_repo_owner.outputs.repo_owner, matrix.codename) || 'type=gha' }}
          cache-to: |
            ${{ matrix.builder == 'osxcross' && format('type=registry,ref=ghcr.io/{0}/golang-cross:buildcache-osxcross-{1},mode=max', steps.get_repo_owner.outputs.repo_owner, matrix.codename) || 'type=gha,mode=max' }}

      - name: Sign the images
        # Nothing is published when building locally for the PR smoke-test.
        if: inputs.push_images != false
        run: |
          if [ -z "$DIGEST" ]; then
            echo "push=true but the build-push step produced no digest; refusing to sign an empty reference" >&2
            exit 1
          fi
          echo "signing ghcr.io/${REPO_OWNER}/${IMAGE_NAME}@${DIGEST}"
          cosign sign --yes "ghcr.io/${REPO_OWNER}/${IMAGE_NAME}@${DIGEST}"
        shell: bash
        env:
          DIGEST: ${{ steps.buildpush.outputs.digest }}
          REPO_OWNER: ${{ steps.get_repo_owner.outputs.repo_owner }}
          IMAGE_NAME: ${{ steps.dockerfile.outputs.image }}

      # PR-stage zig smoke test runs HERE: the image was --load'ed into this
      # job's daemon and nothing was pushed, so no other job can pull it.
      - name: Smoke-test zig image (PR verification)
        if: matrix.builder == 'zig' && inputs.push_images == false && matrix.codename == 'trixie'
        run: |
          IMAGE="ghcr.io/${{ steps.get_repo_owner.outputs.repo_owner }}/golang-cross:v${{ steps.dockerfile.outputs.go_bare }}-0-trixie-zig"
          echo "smoke-testing ${IMAGE}"
          cd example/sqlite-example && make smoke-test IMAGE="${IMAGE}" CONFIG=.goreleaser.zig.yml
          cd ../openssl-example && make smoke-test IMAGE="${IMAGE}"
