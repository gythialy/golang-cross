name: 'Close stale issues and PR'
on:
  schedule:
    - cron: '30 1 * * *'

# Only the latest sweep matters.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  stale:
    permissions:
      # contents: write would additionally be needed for the delete-branch option
      issues: write  # write: labels, comments on and closes stale issues
      pull-requests: write  # write: labels and comments on stale PRs

    runs-on: ubuntu-latest

    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          stale-issue-message: 'This issue is stale because it has been open 60 days with no activity. Remove stale label or comment or this will be closed in 5 days.'
          stale-pr-message: 'This PR is stale because it has been open 45 days with no activity. Remove stale label or comment or this will be closed in 10 days.'
          close-issue-message: 'This issue was closed because it has been stalled for 5 days with no activity.'
          days-before-stale: 60
          days-before-close: 5
          days-before-pr-close: -1
