name: cleanup caches by a branch
on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
  schedule:
    # Daily quota + dead-cache sweep (GitHub cache quota is 10 GB/repo;
    # without this, the LRU auto-eviction can kill the active main cache).
    - cron: '0 0 * * *'

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:
      # Check out the default branch explicitly: on a closed PR the merge ref
      # may already be gone, but we only need scripts/clean-cache.py.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Prune dead and stale caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On a PR-closed event, target exactly that PR's merge ref.
          PR_BRANCH: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
        run: bash scripts/clean-cache.sh
