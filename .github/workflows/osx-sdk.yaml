name: Pack OSX SDK

on:
  schedule:
    # Monthly on the 1st at 03:00 UTC. The macOS SDK only changes when a new
    # Xcode ships, so a monthly rebuild is enough to track Apple releases.
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      os_versions:
        description: >-
          JSON array of runner labels to build, e.g.
          ["macos-13"]. Leave empty to use the default.
          Each tag carries exactly the SDK from that runner's Xcode
          (macos-13 -> MacOSX14 SDK tar, matching the Dockerfile default);
          -large suffix is stripped from tags.
        required: false
        type: string
        default: '["macos-13"]'

permissions: {}

jobs:
  # Stage 1 — on macOS runners, package the SDK from that runner's Xcode into
  # a MacOSX*.sdk.tar.xz and hand it to stage 2 via an artifact. No Docker
  # here: the arm64 macos-14/macos-15 runners are VMs without nested
  # virtualization, where Lima/QEMU cannot start a Docker VM (HV_UNSUPPORTED),
  # so the Docker build happens in stage 2 on a normal Linux runner.
  build-sdk:
    strategy:
      matrix:
        # Runner labels to build. Change the default here or override at
        # workflow_dispatch time via the os_versions input.
        os: ${{ fromJson(inputs.os_versions || '["macos-13"]') }}

    runs-on: ${{ matrix.os }}
    continue-on-error: true

    permissions:
      contents: read

    steps:
      - name: Checkout osxcross
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "tpoechtrager/osxcross"
          ref: "27d21e4977c9751d01199c7a226a6faf494c3dd9"
          path: "osxcross"

      - name: Build OSX SDK
        shell: bash
        run: |
          # Build the macOS SDK tar package with osxcross's script (per
          # README.SDK.md): it packages each SDK found in the runner's Xcode
          # as MacOSX<version>.sdk.tar.xz. Each image tag carries exactly one
          # SDK (macos-13 -> MacOSX14 SDK, matching the Dockerfile default).
          ./osxcross/tools/gen_sdk_package.sh
          find . -type f -name "*.tar.xz" -print0 | xargs shasum -a 256 | tee sha256sum.txt
          sdk_file=$(find . -name "MacOSX*.sdk.tar.xz" | head -n 1)
          [ -f "$sdk_file" ] && echo "sdk_file: $sdk_file"

      - name: Compute image tag
        id: compute_tag
        shell: bash
        env:
          OS_LABEL: ${{ matrix.os }}
        run: |
          # Strip the optional -large suffix from the runner label for the
          # image tag (macos-13-large -> macos-13). GitHub Actions expressions
          # have no replace() function, so do it in shell.
          tag="${OS_LABEL%-large}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Upload SDK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-${{ steps.compute_tag.outputs.tag }}
          path: |
            MacOSX*.sdk.tar.xz
            sha256sum.txt

  # Stage 2 — on a Linux runner, build the scratch image containing that
  # runner's SDK tarball and push it. Docker is native here, so macos-14/15
  # (arm64 VM runners) are supported without needing a Docker VM on macOS.
  push-image:
    needs: [build-sdk]
    strategy:
      matrix:
        os: ${{ fromJson(inputs.os_versions || '["macos-13"]') }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      DOCKER_REGISTRY: "ghcr.io"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image tag
        id: compute_tag
        shell: bash
        env:
          OS_LABEL: ${{ matrix.os }}
        run: |
          tag="${OS_LABEL%-large}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Download SDK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-${{ steps.compute_tag.outputs.tag }}
          path: sdk

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Get Repo Owner
        id: get_repo_owner
        run: echo "repo_owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Prepare SDK_FILE build arg
        id: args
        shell: bash
        run: |
          sdk_file=$(find sdk -name "MacOSX*.sdk.tar.xz" | head -n 1)
          sdk_file="${sdk_file#sdk/}"
          echo "sdk_file=${sdk_file}" >> "$GITHUB_OUTPUT"

      - name: Stage SDK into build context
        shell: bash
        run: mv sdk/MacOSX*.sdk.tar.xz .

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.get_repo_owner.outputs.repo_owner }}/osx-sdk
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.compute_tag.outputs.tag }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ steps.get_repo_owner.outputs.repo_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.osx_sdk
          build-args: |
            SDK_FILE=${{ steps.args.outputs.sdk_file }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
