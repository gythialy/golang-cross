name: Pack OSX SDK

on:
  schedule:
    # Monthly on the 1st at 03:00 UTC. The macOS SDK only changes when a new
    # Xcode ships, so a monthly rebuild is enough to track Apple releases.
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      os_versions:
        description: >-
          JSON array of runner labels to build, e.g.
          ["macos-13"]. Leave empty to use the default.
          Each tag carries exactly the SDK from that runner's Xcode
          (macos-13 -> MacOSX14 SDK tar, matching the Dockerfile default);
          -large suffix is stripped from tags.
        required: false
        type: string
        default: '["macos-13"]'

permissions: {}

jobs:
  build:
    strategy:
      matrix:
        # Runner labels to build. Change the default here or override at
        # workflow_dispatch time via the os_versions input.
        os: ${{ fromJson(inputs.os_versions || '["macos-13"]') }}

    runs-on: ${{ matrix.os }}
    continue-on-error: true

    permissions:
      id-token: write
      packages: write
      contents: read

    env:
      DOCKER_REGISTRY: "ghcr.io"

    steps:
      - name: Set up Docker
        uses: crazy-max/ghaction-setup-docker@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        env:
          SIGN_QEMU_BINARY: 1
          COLIMA_START_ARGS: --cpu 4 --memory 8 --disk 32
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout osxcross
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "tpoechtrager/osxcross"
          ref: "27d21e4977c9751d01199c7a226a6faf494c3dd9"
          path: "osxcross"

      - name: Build OSX SDK
        id: build_sdk_file
        shell: bash
        run: |
          # Build the macOS SDK tar package with osxcross's script (per
          # README.SDK.md): it packages each SDK found in the runner's Xcode
          # as MacOSX<version>.sdk.tar.xz. Each image tag carries exactly one
          # SDK (macos-13 -> MacOSX14 SDK, matching the Dockerfile default).
          ./osxcross/tools/gen_sdk_package.sh
          find . -type f -name "*.tar.xz" -print0 | xargs shasum -a 256 | tee sha256sum.txt
          sdk_file=$(find . -name "MacOSX*.sdk.tar.xz" | head -n 1)
          [ -f "$sdk_file" ] && echo "sdk_file: $sdk_file"
          echo "sdk_file=${sdk_file}" >> "$GITHUB_OUTPUT"

      - name: Get Repo Owner
        id: get_repo_owner
        run: echo "repo_owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute image tag
        id: compute_tag
        shell: bash
        env:
          OS_LABEL: ${{ matrix.os }}
        run: |
          # Strip the optional -large suffix from the runner label for the
          # image tag (macos-13-large -> macos-13). GitHub Actions expressions
          # have no replace() function, so do it in shell.
          tag="${OS_LABEL%-large}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.get_repo_owner.outputs.repo_owner }}/osx-sdk
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.compute_tag.outputs.tag }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.DOCKER_REGISTRY}}
          username: ${{ steps.get_repo_owner.outputs.repo_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: buildpush
        with:
          context: .
          file: Dockerfile.osx_sdk
          build-args: |
            SDK_FILE=${{ steps.build_sdk_file.outputs.sdk_file }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
