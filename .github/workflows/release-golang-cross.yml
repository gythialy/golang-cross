name: release golang-cross

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      versions:
        description: 'Comma-separated majors to release, e.g. 1.24,1.25. Empty = read Pending releases from the latest merged auto-release PR.'
        required: false
        type: string
  release:
    types:
      - created

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      matrix_osxcross: ${{ steps.resolve.outputs.matrix_osxcross }}
      latest_major: ${{ steps.resolve.outputs.latest_major }}
      versions: ${{ steps.resolve.outputs.versions }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve versions to release
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSIONS: ${{ inputs.versions }}
        run: |
          # Priority: dispatch input > release tag > Pending releases in the
          # latest merged auto-release PR body (push events skip when none).
          VERSIONS="$INPUT_VERSIONS"

          if [ -z "$VERSIONS" ] && [ "$EVENT_NAME" = "release" ]; then
            MAJOR_MINOR="${GITHUB_REF_NAME#v}"; MAJOR_MINOR="${MAJOR_MINOR%.*}"
            echo "Release tag: ${GITHUB_REF_NAME} (major.minor: ${MAJOR_MINOR})"
            VERSIONS="$MAJOR_MINOR"
          fi

          if [ -z "$VERSIONS" ]; then
            echo "Reading Pending releases from latest merged auto-release PR..."
            PR=$(gh pr list --state merged --author github-actions[bot] --json number,mergedAt \
                 --jq 'sort_by(.mergedAt) | last | .number')
            if [ -n "$PR" ]; then
              echo "PR #${PR}"
              VERSIONS=$(gh pr view "$PR" --json body --jq '.body' \
                | sed -n '/## Pending releases/,/^## /p' \
                | grep '^[[:space:]]*-' | awk '{print $2}' | paste -sd, -)
            fi
          fi

          # Tolerate whitespace in the dispatch input ("1.24, 1.25"): the
          # matrix jq splits on bare commas, so a stray space would leave a
          # valid major silently unmatched.
          VERSIONS="${VERSIONS// /}"

          echo "Versions to release: ${VERSIONS:-<none>}"
          if [ -z "$VERSIONS" ]; then
            if [ "$EVENT_NAME" = "push" ]; then
              echo "No Pending releases in the latest merged auto-release PR; nothing to do"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "No versions to release (no input, no release tag, no Pending releases found)"
              exit 1
            fi
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          # Fail loudly when a requested major has no versions.json entry.
          # The matrix jq silently drops unknown majors, so a stale Pending
          # list (or a typo in the dispatch input) would otherwise skip that
          # version's images forever while the workflow stays green.
          MISSING=$(echo "$VERSIONS" | tr ',' '\n' | while read -r m; do
            jq -e --arg m "$m" '.releases[$m]' versions.json >/dev/null 2>&1 || echo "$m"
          done)
          if [ -n "$MISSING" ]; then
            echo "No versions.json entry for requested release(s): $(echo "$MISSING" | paste -sd, -)"
            exit 1
          fi

          MATRIX=$(jq -c --arg v "$VERSIONS" \
            '[.releases | to_entries[]
              | .key as $major
              | select(($v | split(",")) | index($major))
              | .value as $r
              | $r.codenames[] as $c
              | $r.builders[] as $b
              | {major: $major, version: $r.version, sha256: $r.sha256,
                 builder: $b, codename: $c}]' versions.json)

          if [[ "$MATRIX" == "[]" || -z "$MATRIX" ]]; then
            # Defensive: the per-major check above should make this
            # unreachable, but never build an empty matrix.
            echo "No version entries in versions.json for: ${VERSIONS}"
            exit 1
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          # osxcross-only matrix for the release job (zig is self-contained and
          # built by builder.yml's build job, so it needs no main-image build).
          MATRIX_OSXCROSS=$(echo "$MATRIX" | jq -c '[.[] | select(.builder == "osxcross")]')
          echo "matrix_osxcross=${MATRIX_OSXCROSS}" >> "$GITHUB_OUTPUT"
          echo "versions=${VERSIONS}" >> "$GITHUB_OUTPUT"
          echo "latest_major=$(jq -r '.supported[-1]' versions.json)" >> "$GITHUB_OUTPUT"
          echo "Matrix: ${MATRIX}"

  build-builder:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    # Publish the builder images the PR stage built locally: the main-image
    # FROM below needs them in the registry.
    uses: ./.github/workflows/builder.yml
    with:
      ref: main
      version: ${{ needs.resolve.outputs.versions }}
      latest_major: ${{ needs.resolve.outputs.latest_major }}
      publish_latest: true
      push_images: true

  release:
    needs: [resolve, build-builder]
    # Only the osxcross main image builds here (zig is self-contained and
    # already published by builder.yml); skip when this release has none.
    if: needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.matrix_osxcross != '[]'
    strategy:
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.matrix_osxcross) }}

    permissions:
      id-token: write
      packages: write
      contents: read

    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Get Repo Owner
        id: get_repo_owner
        run: echo "repo_owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Prepare version params
        id: params
        run: |
          GO_VERSION="${{ matrix.version }}"
          echo "go_version_bare=${GO_VERSION#go}" >> "$GITHUB_OUTPUT"
          echo "builder_tag=v${GO_VERSION#go}-0" >> "$GITHUB_OUTPUT"
          # Only the osxcross main image builds here, so the Dockerfile is fixed.
          echo "dockerfile=Dockerfile" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.get_repo_owner.outputs.repo_owner }}/golang-cross
          tags: |
            type=raw,value=v${{ steps.params.outputs.go_version_bare }}-0-${{ matrix.codename }}
            type=raw,value=${{ matrix.major }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ steps.get_repo_owner.outputs.repo_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build args
        id: args
        run: |
          # The osxcross Dockerfile takes BUILDER_TAG + OS_CODENAME only;
          # Go comes preinstalled in the golang-cross-builder base image.
          echo "go_arg=${{ steps.params.outputs.go_version_bare }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: buildpush
        with:
          context: .
          file: ${{ steps.params.outputs.dockerfile }}
          push: true
          load: true
          build-args: |
            OS_CODENAME=${{ matrix.codename }}
            GO_VERSION=${{ steps.args.outputs.go_arg }}
            BUILDER_TAG=${{ steps.params.outputs.builder_tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the images
        run: |
          if [ -z "$DIGEST" ]; then
            echo "push=true but the build-push step produced no digest; refusing to sign an empty reference" >&2
            exit 1
          fi
          echo "signing ghcr.io/${REPO_OWNER}/golang-cross@${DIGEST}"
          cosign sign --yes "ghcr.io/${REPO_OWNER}/golang-cross@${DIGEST}"
        shell: bash
        env:
          DIGEST: ${{ steps.buildpush.outputs.digest }}
          REPO_OWNER: ${{ steps.get_repo_owner.outputs.repo_owner }}

      # Smoke-test the published osxcross image against the sqlite example.
      # (zig is smoke-tested in builder.yml's build job during PR verification.)
      - name: Test sqlite-example (cgo cross-compile smoke)
        if: matrix.codename == 'trixie'
        run: |
          cd example/sqlite-example
          IMAGE="ghcr.io/${{ steps.get_repo_owner.outputs.repo_owner }}/golang-cross:v${{ steps.params.outputs.go_version_bare }}-0-trixie"
          echo "testing with ${IMAGE}"
          make smoke-test IMAGE="${IMAGE}" CONFIG=".goreleaser.yml"
