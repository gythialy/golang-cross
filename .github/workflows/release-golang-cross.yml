name: release golang-cross

# Publishing is owned by the vX.Y.Z-N release tag, and nothing else. Every
# published image is therefore signed with a cosign identity of
# `<workflow>@refs/tags/vX.Y.Z-N`, which is what downstreams pin.
#
# There used to be a `push: branches: [main]` trigger that published on merge.
# It made the same image tag get built up to three times per bump (merge, then
# the vX.Y.Z release, then the vX.Y.Z-N release); because the build is not
# reproducible each pass pushed a different digest, so the tag moved and the
# previous digest was left published-but-untagged with a stale signature. Worse,
# a bump that never got a release (1.25.14, 1.26.7, 1.27.0) ended up with its
# only signature reading `@refs/heads/main`, which no downstream can pin to a
# version. Dispatch from the tag ref for a manual re-release.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Comma-separated majors to release, e.g. 1.24,1.25. Empty = read Pending releases from the latest merged auto-release PR.'
        required: false
        type: string
  release:
    types:
      - created

# One publish at a time per release tag, and never cancel one in flight: a
# half-pushed manifest can leave a tag pointing at nothing, and two concurrent
# runs for the same tag would race to push the same image tags — the digest
# orphaning this workflow was restructured to prevent. Grouped by ref, so
# releasing v1.26.8-0 and v1.27.1-0 in parallel still works.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      matrix_osxcross: ${{ steps.resolve.outputs.matrix_osxcross }}
      latest_major: ${{ steps.resolve.outputs.latest_major }}
      versions: ${{ steps.resolve.outputs.versions }}
      revision: ${{ steps.resolve.outputs.revision }}
      skip: ${{ steps.resolve.outputs.skip }}

    permissions:
      contents: read
      pull-requests: read  # read: gh pr list/view, to scrape the Pending releases list

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve versions to release
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSIONS: ${{ inputs.versions }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          # Everything this job publishes is signed with the identity of the ref
          # it runs on, so refuse to publish from a branch: that is how the
          # `@refs/heads/main` signatures got created. A manual re-release
          # dispatches against the tag (`gh workflow run ... --ref v1.27.1-0`).
          # gh workflow run takes a workflow name, id or *file name* -- not the
          # owner/repo/.github/workflows/... path that GITHUB_WORKFLOW_REF
          # holds -- so reduce it to the basename or the hints below are
          # uncopyable.
          WF="${GITHUB_WORKFLOW_REF%%@*}"; WF="${WF##*/}"

          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Refusing to publish from ${GITHUB_REF} — images would be signed" >&2
            echo "@${GITHUB_REF} instead of @refs/tags/vX.Y.Z-N. Dispatch against" >&2
            echo "the release tag instead: gh workflow run ${WF} --ref vX.Y.Z-N" >&2
            exit 1
          fi

          # Priority: dispatch input > release tag > Pending releases in the
          # latest merged auto-release PR body.
          VERSIONS="$INPUT_VERSIONS"

          # Every bump publishes TWO releases on the same commit — vX.Y.Z and
          # vX.Y.Z-N — and both fire `release: created`. Building on both ran the
          # whole matrix twice and, because the rebuild is not reproducible, left
          # the image tag pointing at the second run's digest while the first
          # run's (differently signed) digest stayed published but untagged.
          # Anyone pinning a digest between the two releases got that orphan,
          # whose cosign cert reads @refs/tags/vX.Y.Z. Only the build-revision
          # tag releases, so the signing identity is always @refs/tags/vX.Y.Z-N.
          #
          # N is the image BUILD REVISION: the same Go version rebuilt, e.g.
          # after a tool bump. It is threaded through every image tag, so
          # v1.27.1-1 publishes v1.27.1-1-trixie-zig plus the v1.27.1-1 alias,
          # which is how v1.17.5-4, v1.20.5-1 and 24 other historical tags were
          # published. An earlier revision of this workflow hard-coded -0 and
          # rejected any other N, which regressed that and broke the v1.27.1-1
          # release.
          # The revision must be canonical: -0 and -00 would otherwise be two
          # distinct image tags for the same build revision.
          TAG="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-(0|[1-9][0-9]*)$'; then
            # Quiet skip only for `release: created`, where a bare vX.Y.Z is the
            # expected companion release and failing would make every bump red.
            # A workflow_dispatch is someone explicitly asking for a release, so
            # a green no-op would tell them it worked when nothing shipped --
            # fail instead, even if they passed inputs.versions.
            if [ "$EVENT_NAME" = "release" ]; then
              echo "Ref ${GITHUB_REF_NAME} is not a build-revision tag (expected vX.Y.Z-N); nothing to release"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Refusing to release from ${GITHUB_REF_NAME}: not a build-revision" >&2
            echo "tag (expected vX.Y.Z-N). Nothing would have been published, so" >&2
            echo "failing rather than reporting success. Dispatch against the" >&2
            echo "release tag: gh workflow run ${WF} --ref vX.Y.Z-N" >&2
            exit 1
          fi

          TAG_VERSION="${TAG%-*}"           # X.Y.Z
          REVISION="${TAG##*-}"             # N
          TAG_MAJOR="${TAG_VERSION%.*}"     # X.Y

          # A release event names one version. So does any ref carrying a
          # non-zero build revision -- N is meaningless for majors the ref says
          # nothing about -- so resolve it here rather than reading the Pending
          # list and then bouncing the dispatcher for asking the wrong thing.
          if [ -z "$VERSIONS" ] && { [ "$EVENT_NAME" = "release" ] || [ "$REVISION" != "0" ]; }; then
            echo "Release ref: ${GITHUB_REF_NAME} (major.minor: ${TAG_MAJOR}, revision: ${REVISION})"
            VERSIONS="$TAG_MAJOR"
          fi

          if [ -z "$VERSIONS" ]; then
            echo "Reading Pending releases from latest merged auto-release PR..."
            PR=$(gh pr list --state merged --author github-actions[bot] --json number,mergedAt \
                 --jq 'sort_by(.mergedAt) | last | .number')
            if [ -n "$PR" ]; then
              echo "PR #${PR}"
              # Collect the majors listed under the "Pending releases" heading.
              # The old sed range (/## Pending releases/,/^## /) never matched
              # the "### How to release" heading that follows, so it ran to
              # end-of-body and scraped every later list item as a pending
              # major. Terminating on a looser /^#/ instead would break the
              # other way: any hash at column 0 -- a fenced shell comment, a
              # "#hashtag" -- would truncate the list early and silently
              # release fewer majors than the PR asked for.
              #
              # So: skip fenced blocks entirely, treat any heading level as a
              # section boundary, and stay "inside" only while the current
              # heading is Pending releases.
              VERSIONS=$(gh pr view "$PR" --json body --jq '.body' | awk '
                /^```/                     { fence = !fence; next }
                fence                      { next }
                /^#+ /                     { inside = ($0 ~ /^#+[[:space:]]+Pending releases[[:space:]]*$/); next }
                inside && /^[[:space:]]*-/ { if ($2 != "") print $2 }
              ' | paste -sd, -)
            fi
          fi

          # Tolerate whitespace in the dispatch input ("1.24, 1.25"): the
          # matrix jq splits on bare commas, so a stray space would leave a
          # valid major silently unmatched.
          VERSIONS="${VERSIONS// /}"

          echo "Versions to release: ${VERSIONS:-<none>}"
          if [ -z "$VERSIONS" ]; then
            echo "No versions to release (no input, no release tag, no Pending releases found)"
            exit 1
          fi

          # Everything below runs on the normalized, resolved list -- these
          # guards used to sit above the Pending-releases read and the
          # whitespace strip, so they judged a value that was often empty or
          # space-padded and refused runs that were in fact well formed.

          # The images this run publishes are signed @refs/tags/vX.Y.Z-N, so the
          # version the ref names has to be one of the versions actually built.
          # Otherwise `--ref v1.27.1-0 -f versions=1.26` publishes 1.26 images
          # carrying a 1.27.1 identity, and nothing the ref names is built.
          case ",${VERSIONS}," in
            *",${TAG_MAJOR},"*) ;;
            *)
              echo "Ref ${GITHUB_REF_NAME} names ${TAG_MAJOR}, but this run would release:" >&2
              echo "${VERSIONS}. The images would be signed @refs/tags/${GITHUB_REF_NAME}" >&2
              echo "while ${TAG_MAJOR} is never built. Dispatch from a ref naming one of" >&2
              echo "the versions being released." >&2
              exit 1
              ;;
          esac

          # A non-zero revision is a property of one version's images, so it
          # cannot be stamped onto the other majors in a multi-version run.
          # Those are fresh bumps at revision 0 by definition -- the
          # Pending-releases path after an auto-release PR merges.
          if [ "$REVISION" != "0" ] && [ "$VERSIONS" != "$TAG_MAJOR" ]; then
            echo "Ref ${GITHUB_REF_NAME} carries build revision ${REVISION}, which applies" >&2
            echo "only to ${TAG_MAJOR}, but this run would release: ${VERSIONS}." >&2
            echo "Release one version per revision tag, or dispatch from a -0 tag" >&2
            echo "to rebuild several at revision 0." >&2
            exit 1
          fi

          # Pinning by tag only works if the tag's version is the one that gets
          # built. versions.json is the source of the Go version, so a ref naming
          # a different one -- tag cut before the manifest was bumped, or after
          # it moved on -- must fail rather than publish vX.Y.Z-N images built
          # from some other X.Y.Z. TAG_MAJOR is guaranteed present by the
          # membership check above, so this now runs on every path.
          MANIFEST_VERSION=$(jq -r --arg m "$TAG_MAJOR" '.releases[$m].version // empty' versions.json)
          if [ -n "$MANIFEST_VERSION" ] && [ "${MANIFEST_VERSION#go}" != "$TAG_VERSION" ]; then
            echo "Ref ${GITHUB_REF_NAME} names Go ${TAG_VERSION}, but versions.json has" >&2
            echo "${MANIFEST_VERSION} for ${TAG_MAJOR}. Publishing would tag images" >&2
            echo "v${TAG_VERSION}-${REVISION}-* built from ${MANIFEST_VERSION}." >&2
            exit 1
          fi
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"

          # Fail loudly when a requested major has no versions.json entry.
          # The matrix jq silently drops unknown majors, so a stale Pending
          # list (or a typo in the dispatch input) would otherwise skip that
          # version's images forever while the workflow stays green.
          MISSING=""
          for m in $(echo "$VERSIONS" | tr ',' '\n'); do
            jq -e --arg m "$m" '.releases[$m]' versions.json >/dev/null 2>&1 || MISSING="${MISSING}${m},"
          done
          if [ -n "$MISSING" ]; then
            echo "No versions.json entry for requested release(s): ${MISSING%,}"
            exit 1
          fi

          MATRIX=$(jq -c --arg v "$VERSIONS" \
            '[.releases | to_entries[]
              | .key as $major
              | select(($v | split(",")) | index($major))
              | .value as $r
              | $r.codenames[] as $c
              | $r.builders[] as $b
              | {major: $major, version: $r.version, sha256: $r.sha256,
                 builder: $b, codename: $c}]' versions.json)

          if [[ "$MATRIX" == "[]" || -z "$MATRIX" ]]; then
            # Defensive: the per-major check above should make this
            # unreachable, but never build an empty matrix.
            echo "No version entries in versions.json for: ${VERSIONS}"
            exit 1
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          # osxcross-only matrix for the release job (zig is self-contained and
          # built by builder.yml's build job, so it needs no main-image build).
          MATRIX_OSXCROSS=$(echo "$MATRIX" | jq -c '[.[] | select(.builder == "osxcross")]')
          echo "matrix_osxcross=${MATRIX_OSXCROSS}" >> "$GITHUB_OUTPUT"
          echo "versions=${VERSIONS}" >> "$GITHUB_OUTPUT"
          echo "latest_major=$(jq -r '.supported[-1]' versions.json)" >> "$GITHUB_OUTPUT"

          # Re-running a release that already published everything would rebuild
          # it, and since the build is not reproducible the new digest replaces
          # the tag and strands the old one — the same orphan-with-a-stale-
          # signature problem, just from a re-run instead of a second tag. Skip
          # only when every expected final tag already exists in ghcr (a partial
          # release still reruns everything); explicit dispatch always rebuilds,
          # which is the escape hatch for forcing a fresh digest. A failed tag
          # listing aborts instead of falling back to a blind full rebuild.
          if [ "$EVENT_NAME" = "release" ]; then
            chmod +x scripts/registry-tags.sh
            fetch_tags() {
              local out
              out=$(bash scripts/registry-tags.sh "$REPO_OWNER" "$1") || {
                echo "ghcr tag listing failed for $1; refusing to decide blindly" >&2
                exit 1
              }
              printf '%s\n' "$out" | sort -u
            }
            TOOLS_TAGS=$(fetch_tags golang-cross-tools)
            MAIN_TAGS=$(fetch_tags golang-cross)
            BUILDER_TAGS=$(fetch_tags golang-cross-builder)
            # REVISION is read inside the pipeline's subshell below.
            export REVISION
            MISSING=$(echo "$MATRIX" | jq -r '.[] | [.major, .version, .codename, .builder] | @tsv' |
              while read -r major version codename builder; do
                vb="${version#go}"
                if [ "$builder" = "zig" ]; then
                  # zig is self-contained: builder.yml publishes the final image.
                  want="v${vb}-${REVISION}-${codename}-zig"
                  grep -Fxq -- "$want" <<<"$MAIN_TAGS" || echo "${major}: golang-cross:${want}"
                  # The trixie zig build also owns the codename-less vX.Y.Z-N
                  # alias. It has to be checked separately or "skip" would not
                  # mean what it says: if the alias alone went missing (partial
                  # push, or someone deleting a tag) the codename tag above
                  # would still be present and the re-run would skip forever,
                  # never restoring it.
                  if [ "$codename" = "trixie" ]; then
                    grep -Fxq -- "v${vb}-${REVISION}" <<<"$MAIN_TAGS" || echo "${major}: golang-cross:v${vb}-${REVISION}"
                  fi
                else
                  # osxcross needs BOTH the builder base (builder.yml) and the
                  # main image the release job builds FROM it. Checking only the
                  # base would let a run where the main image failed count as
                  # complete and skip forever.
                  want="v${vb}-${REVISION}-${codename}"
                  grep -Fxq -- "$want" <<<"$BUILDER_TAGS" || echo "${major}: golang-cross-builder:${want}"
                  grep -Fxq -- "$want" <<<"$MAIN_TAGS" || echo "${major}: golang-cross:${want}"
                fi
                tools="v${vb}-${REVISION}-${codename}"
                grep -Fxq -- "$tools" <<<"$TOOLS_TAGS" || echo "${major}: golang-cross-tools:${tools}"
              done)
            if [ -z "$MISSING" ]; then
              echo "All requested images already published; nothing to rebuild"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Missing images, rebuilding:"
            echo "$MISSING"
          fi

          # Written exactly once, and only here: the skip=true paths above all
          # exit immediately. Emitting the key twice leaves which value wins up
          # to the runner's parser.
          echo "skip=false" >> "$GITHUB_OUTPUT"

          echo "Matrix: ${MATRIX}"

  build-builder:
    # A reusable workflow cannot elevate beyond its caller, so this has to
    # cover everything builder.yml's own jobs request -- including
    # id-token: write, without which their `cosign sign` fails at runtime.
    permissions:
      contents: read
      packages: write  # write: builder.yml publishes the base images the main image builds FROM
      id-token: write  # write: keyless cosign signing inside builder.yml

    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    # Publish the builder images the PR stage built locally: the main-image
    # FROM below needs them in the registry.
    uses: $/.github/workflows/builder.yml
    with:
      # Build from the ref that triggered this release, NOT from main. These
      # images are signed with an identity of @refs/tags/vX.Y.Z-N, so building
      # them from main would attest a tag while shipping whatever main happens
      # to hold — and main moves the moment any other PR merges between the
      # bump landing and the release being cut. The `release` job below already
      # checks out the triggering ref; this makes build-builder agree with it.
      ref: ${{ github.ref }}
      version: ${{ needs.resolve.outputs.versions }}
      revision: ${{ needs.resolve.outputs.revision }}
      latest_major: ${{ needs.resolve.outputs.latest_major }}
      publish_latest: true
      push_images: true

  release:
    needs: [resolve, build-builder]
    # Only the osxcross main image builds here (zig is self-contained and
    # already published by builder.yml); skip when this release has none.
    if: needs.resolve.outputs.skip != 'true' && needs.resolve.outputs.matrix_osxcross != '[]'
    strategy:
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.matrix_osxcross) }}

    permissions:
      id-token: write  # write: keyless cosign signing of the published main image
      packages: write  # write: pushes ghcr.io/<owner>/golang-cross
      contents: read

    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Get Repo Owner
        id: get_repo_owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "repo_owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Prepare version params
        id: params
        env:
          MATRIX_VERSION: ${{ matrix.version }}
          REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          GO_VERSION="$MATRIX_VERSION"
          echo "go_version_bare=${GO_VERSION#go}" >> "$GITHUB_OUTPUT"
          echo "builder_tag=v${GO_VERSION#go}-${REVISION}" >> "$GITHUB_OUTPUT"
          # Only the osxcross main image builds here, so the Dockerfile is fixed.
          echo "dockerfile=Dockerfile" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.get_repo_owner.outputs.repo_owner }}/golang-cross
          tags: |
            type=raw,value=v${{ steps.params.outputs.go_version_bare }}-${{ needs.resolve.outputs.revision }}-${{ matrix.codename }}
            type=raw,value=${{ matrix.major }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ steps.get_repo_owner.outputs.repo_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build args
        id: args
        env:
          GO_BARE: ${{ steps.params.outputs.go_version_bare }}
        run: |
          # The osxcross Dockerfile takes BUILDER_TAG + OS_CODENAME only;
          # Go comes preinstalled in the golang-cross-builder base image.
          echo "go_arg=${GO_BARE}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: buildpush
        with:
          context: .
          file: ${{ steps.params.outputs.dockerfile }}
          push: true
          load: true
          build-args: |
            OS_CODENAME=${{ matrix.codename }}
            GO_VERSION=${{ steps.args.outputs.go_arg }}
            BUILDER_TAG=${{ steps.params.outputs.builder_tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the images
        run: |
          if [ -z "$DIGEST" ]; then
            echo "push=true but the build-push step produced no digest; refusing to sign an empty reference" >&2
            exit 1
          fi
          echo "signing ghcr.io/${REPO_OWNER}/golang-cross@${DIGEST}"
          cosign sign --yes "ghcr.io/${REPO_OWNER}/golang-cross@${DIGEST}"
        shell: bash
        env:
          DIGEST: ${{ steps.buildpush.outputs.digest }}
          REPO_OWNER: ${{ steps.get_repo_owner.outputs.repo_owner }}

      # Smoke-test the published osxcross image against the sqlite example.
      # (zig is smoke-tested in builder.yml's build job during PR verification.)
      - name: Test sqlite-example (cgo cross-compile smoke)
        if: matrix.codename == 'trixie'
        env:
          GO_BARE: ${{ steps.params.outputs.go_version_bare }}
          REVISION: ${{ needs.resolve.outputs.revision }}
          REPO_OWNER: ${{ steps.get_repo_owner.outputs.repo_owner }}
        run: |
          cd example/sqlite-example
          IMAGE="ghcr.io/${REPO_OWNER}/golang-cross:v${GO_BARE}-${REVISION}-trixie"
          echo "testing with ${IMAGE}"
          make smoke-test IMAGE="${IMAGE}" CONFIG=".goreleaser.yml"
