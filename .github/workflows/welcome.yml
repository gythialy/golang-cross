name: Welcome

on:
  pull_request:
    branches:
      - main
    types:
      - opened
  issues:
    types:
      - opened

# One greeting per issue/PR; a superseded run has nothing left to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.event.issue.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  welcome:
    runs-on: ubuntu-latest

    permissions:
      issues: write  # write: posts the first-interaction comment on a new issue
      pull-requests: write  # write: posts the first-interaction comment on a new PR
      contents: read

    steps:
      - name: First interaction
        if: ${{ !endsWith(github.actor, '[bot]') }}
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          issue_message: |
            Hello! Thank you for filing an issue.

            If this is a bug report, please include relevant logs to help us debug the problem.
          pr_message: |
            Hello! Thank you for your contribution. 👋👋👋

            If you are fixing a bug, please reference the issue number in the description.
            If you are implementing a feature request, please check with the maintainers that the feature will be accepted first.
