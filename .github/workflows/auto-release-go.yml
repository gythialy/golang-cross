name: 🤖 Auto Release on Go Update

on:
  schedule:
    # Daily check at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  detect-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      go_version: ${{ steps.parse.outputs.go_version }}
      builder_tag: ${{ steps.parse.outputs.builder_tag }}
      branch_name: ${{ steps.parse.outputs.branch_name }}
      go_changed: ${{ steps.parse.outputs.go_changed }}
      skip: ${{ steps.parse.outputs.skip }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false

      - name: Run check-update.sh
        id: check
        run: |
          bash scripts/check-update.sh | tee /tmp/check-update.log
          # consume machine-readable versions block printed by the script
          GO_VERSION=$(sed -n '/^##VERSIONS##$/,$p' /tmp/check-update.log | grep '^GO_VERSION=' | cut -d= -f2)
          echo "go_version=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected Go version: ${GO_VERSION}"

      - name: Compare and prepare
        id: parse
        run: |
          CURRENT_GO=$(git show HEAD:Dockerfile | sed -n 's/^ARG GO_VERSION=go//p')
          NEW_GO="${{ steps.check.outputs.go_version }}"
          NEW_GO=${NEW_GO#go}

          # no file changes means nothing to update
          if git diff --quiet -- Dockerfile Dockerfile.builder; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No changes — nothing to do"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT_GO" != "$NEW_GO" ]; then
            echo "go_changed=true" >> "$GITHUB_OUTPUT"
            echo "branch_name=auto-release/go-${NEW_GO}" >> "$GITHUB_OUTPUT"
          else
            echo "go_changed=false" >> "$GITHUB_OUTPUT"
            echo "branch_name=auto-release/tools" >> "$GITHUB_OUTPUT"
          fi

          echo "go_version=${NEW_GO}" >> "$GITHUB_OUTPUT"
          echo "builder_tag=v${NEW_GO}-0" >> "$GITHUB_OUTPUT"
          echo "Go version: ${CURRENT_GO} → ${NEW_GO}"

      - name: Sync Dockerfile.builder and FROM tag
        if: steps.parse.outputs.skip == 'false' && steps.parse.outputs.go_changed == 'true'
        run: |
          GO_VER="${{ steps.parse.outputs.go_version }}"

          # Sync GO_VERSION in Dockerfile.builder
          CURRENT_BUILDER_GO=$(grep '^ARG GO_VERSION=' Dockerfile.builder | sed 's/ARG GO_VERSION=//')
          if [ "$CURRENT_BUILDER_GO" != "$GO_VER" ]; then
            sed -i "s/^ARG GO_VERSION=${CURRENT_BUILDER_GO}/ARG GO_VERSION=${GO_VER}/" Dockerfile.builder
          fi

          # Sync the FROM tag in Dockerfile (builder image reference)
          sed -i "s|golang-cross-builder:v[0-9.]*-0|golang-cross-builder:v${GO_VER}-0|" Dockerfile

      - name: Commit and push to branch
        if: steps.parse.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile Dockerfile.builder
          if [ "${{ steps.parse.outputs.go_changed }}" = "true" ]; then
            git commit -m "🤖 bump go to ${{ steps.parse.outputs.go_version }} and tools"
          else
            git commit -m "🤖 update tool dependencies"
          fi

          BRANCH="${{ steps.parse.outputs.branch_name }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:${BRANCH}"

  build-builder:
    needs: detect-and-update
    if: needs.detect-and-update.outputs.skip == 'false' && needs.detect-and-update.outputs.go_changed == 'true'

    strategy:
      matrix:
        codename: [bookworm, trixie]

    runs-on: ubuntu-latest
    continue-on-error: false

    permissions:
      id-token: write
      packages: write
      contents: read

    env:
      GOLANG_CROSS_TAG: ${{ needs.detect-and-update.outputs.builder_tag }}-${{ matrix.codename }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.detect-and-update.outputs.branch_name }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Get Repo Owner
        id: get_repo_owner
        run: echo "repo_owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.get_repo_owner.outputs.repo_owner }}/golang-cross-builder
          tags: |
            type=raw,value=${{ env.GOLANG_CROSS_TAG }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ steps.get_repo_owner.outputs.repo_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: buildpush
        with:
          context: .
          file: Dockerfile.builder
          push: true
          build-args: |
            GO_VERSION=${{ needs.detect-and-update.outputs.go_version }}
            OSX_VERSION_MIN=10.13
            OSX_CROSS_COMMIT=ff8d100f3f026b4ffbe4ce96d8aac4ce06f1278b
            OS_CODENAME=${{ matrix.codename }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the images
        run: |
          echo "sign ${STEPS_BUILDPUSH_OUTPUTS_DIGEST}"
          cosign sign --yes "ghcr.io/${STEPS_GET_REPO_OWNER_OUTPUTS_REPO_OWNER}/golang-cross-builder@${STEPS_BUILDPUSH_OUTPUTS_DIGEST}"
        shell: bash
        env:
          STEPS_BUILDPUSH_OUTPUTS_DIGEST: ${{ steps.buildpush.outputs.digest }}
          STEPS_GET_REPO_OWNER_OUTPUTS_REPO_OWNER: ${{ steps.get_repo_owner.outputs.repo_owner }}

  create-pr:
    needs: [detect-and-update, build-builder]
    if: always() && needs.detect-and-update.result == 'success' && needs.detect-and-update.outputs.skip == 'false' && (needs.detect-and-update.outputs.go_changed == 'false' || needs.build-builder.result == 'success')

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GO_VER="${{ needs.detect-and-update.outputs.go_version }}"
          GO_CHANGED="${{ needs.detect-and-update.outputs.go_changed }}"
          BRANCH="${{ needs.detect-and-update.outputs.branch_name }}"

          # Write PR body with echo/printf — NOT a heredoc: under YAML
          # block-scalar indentation the heredoc terminator carries leading
          # spaces, which neither << nor <<- can match, so the heredoc
          # silently swallows the rest of the script (title + gh pr create
          # never ran).
          if [ "$GO_CHANGED" = "true" ]; then
            {
              echo "## What's Changed"
              echo
              echo "Bump Go to **${GO_VER}** and update tool dependencies."
              echo
              echo "### Builder images"
              echo "- \`ghcr.io/gythialy/golang-cross-builder:v${GO_VER}-0-bookworm\`"
              echo "- \`ghcr.io/gythialy/golang-cross-builder:v${GO_VER}-0-trixie\`"
              echo
              echo "### How to release"
              echo "1. Review and merge this PR"
              echo "2. Create a GitHub Release with tag \`v${GO_VER}\`"
              echo "3. The [release workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/release-golang-cross.yml) will build and publish the main \`golang-cross\` Docker image"
            } > /tmp/pr-body.md
            TITLE="🤖 bump go to ${GO_VER} and tools"
          else
            {
              echo "## What's Changed"
              echo
              echo "Update tool dependencies (Go version unchanged at **${GO_VER}**)."
              echo
              echo "### How to release"
              echo "1. Review and merge this PR"
              echo "2. The [release workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/release-golang-cross.yml) will build and publish the main \`golang-cross\` Docker image"
            } > /tmp/pr-body.md
            TITLE="🤖 update tool dependencies"
          fi

          # Check if PR already exists for this branch
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already exists for branch ${BRANCH}, updating body and assignees"
            gh pr edit "$EXISTING_PR" \
              --title "$TITLE" \
              --body-file /tmp/pr-body.md \
              --add-assignee gythialy
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body-file /tmp/pr-body.md \
              --assignee gythialy
          fi
